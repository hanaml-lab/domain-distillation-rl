[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-distill"
version = "0.1.0"
description = "GATE: gap-adaptive mixing of on-policy distillation and verifiable rewards for small domain specialists"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Manav Agarwal", email = "manav@hanaml.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
gate-demo = "gate_distill.demo:main"
gate-toy = "gate_distill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
